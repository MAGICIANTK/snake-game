<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGICIAN TK // CYBER SNAKE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --neon-purple: #9c27b0;
            --neon-glow: rgba(156, 39, 176, 0.6);
            --cyan-accent: #00f0ff;
            --text-main: #f3f4f6;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.4) 0%, transparent 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 100%, 100% 4px;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .arcade-cabinet {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(156, 39, 176, 0.4);
            box-shadow: 0 0 40px rgba(156, 39, 176, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(90deg, #d946ef, var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(217, 70, 239, 0.5);
            letter-spacing: 2px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .hud span {
            color: var(--cyan-accent);
            font-weight: bold;
        }

        canvas {
            border: 2px solid rgba(0, 240, 255, 0.2);
            background: #030712;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #6b7280;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <header>
            <h1>MAGICIAN TK // SNAKE</h1>
        </header>

        <div class="hud">
            <div>SCORE: <span id="scoreVal">0</span></div>
            <div>TARGET: <span id="targetVal">M</span></div>
            <div>HIGH: <span id="highVal">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls-hint">
            [ ARROW KEYS ] TO NAVIGATE // [ R ] TO RESTART
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const scoreEl = document.getElementById("scoreVal");
        const targetEl = document.getElementById("targetVal");
        const highEl = document.getElementById("highVal");

        const GRID_SIZE = 20;
        const TILE_COUNT = 20;
        const WORD = "MAGICIANTK";

        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let velocity = {x: 0, y: -1};
        let nextVelocity = {x: 0, y: -1};
        
        let foodIndex = 0;
        let food = {x: 5, y: 5, char: WORD[0]};
        let score = 0;
        let highscore = localStorage.getItem("magician_snake_high") || 0;
        highEl.innerText = highscore;

        let particles = [];
        let gameOver = false;

        class Particle {
            constructor(x, y, color) {
                this.x = x * GRID_SIZE + 10;
                this.y = y * GRID_SIZE + 10;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = color;
                this.life = 1.0;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(part => part.x === food.x && part.y === food.y);
            }
            food.char = WORD[foodIndex];
            targetEl.innerText = food.char;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            velocity = {x: 0, y: -1};
            nextVelocity = {x: 0, y: -1};
            score = 0;
            foodIndex = 0;
            scoreEl.innerText = score;
            gameOver = false;
            spawnFood();
        }

        function update() {
            if (gameOver) return;

            velocity = nextVelocity;
            let head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            // Wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                triggerGameOver();
                return;
            }

            // Self collision
            if (snake.some(part => part.x === head.x && part.y === head.y)) {
                triggerGameOver();
                return;
            }

            snake.unshift(head);

            // Eat food check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem("magician_snake_high", highscore);
                    highEl.innerText = highscore;
                }

                // Create particles
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(food.x, food.y, '#00f0ff'));
                }

                foodIndex = (foodIndex + 1) % WORD.length;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function triggerGameOver() {
            gameOver = true;
        }

        function draw() {
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines subtly
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Draw Particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Draw Food with pulsing glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 18px 'Fira Code'";
            ctx.fillText(food.char, food.x * GRID_SIZE + 4, food.y * GRID_SIZE + 16);
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.shadowBlur = index === 0 ? 12 : 4;
                ctx.shadowColor = "#9c27b0";
                ctx.fillStyle = index === 0 ? "#d946ef" : "#9c27b0";
                ctx.fillRect(part.x * GRID_SIZE + 2, part.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
            });
            ctx.shadowBlur = 0;

            // Game Over Screen Overlay
            if (gameOver) {
                ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#f3f4f6";
                ctx.font = "bold 22px 'Fira Code'";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM CRASH", canvas.width / 2, canvas.height / 2 - 15);
                
                ctx.fillStyle = "#00f0ff";
                ctx.font = "12px 'Fira Code'";
                ctx.fillText("PRESS [ R ] TO REBOOT", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) nextVelocity = {x: 0, y: -1};
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) nextVelocity = {x: 0, y: 1};
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) nextVelocity = {x: -1, y: 0};
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) nextVelocity = {x: 1, y: 0};
                    break;
                case 'r':
                case 'R':
                    if (gameOver) resetGame();
                    break;
            }
        });

        spawnFood();
        setInterval(() => {
            update();
            draw();
        }, 100);
    </script>
</body>
</html>
